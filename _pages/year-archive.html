---
layout: archive
permalink: /year-archive/
title: "Blog posts"
author_profile: true
redirect_from:
  - /wordpress/blog-posts/
---

{% include base_path %}

<ul style="list-style-type:none; padding-left:0;">
{% for post in site.posts %}
  <li style="margin-bottom:12px;">
    <a href="{{ base_path }}{{ post.url }}" style="font-size:1rem; font-weight:500; text-decoration:none;">
      {{ post.title }}
    </a>
    <span style="font-size:0.85rem; margin-left:8px; opacity:0.7;">
      {{ post.date | date: "%Y-%m-%d" }}
    </span>
  </li>
{% endfor %}
</ul>
